*{box-sizing:border-box}html{background:var(--bg);color-scheme:light}body{margin:0;background:var(--bg);color:var(--fg);min-height:100dvh}body[data-theme="dark"]{color-scheme:dark}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--accent)}h1{margin:0;font-size:28px}h2{font-size:20px}.app{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:100vh}.nav{background:var(--panel);border-right:1px solid var(--edge);padding:20px 12px;display:flex;flex-direction:column;gap:8px}.logo{font-size:22px;font-weight:800;padding:8px 10px 23px}.nav button,.bottom button{background:transparent;color:var(--fg);border:0;padding:12px;text-align:left;border-radius:12px}.nav button.active,.bottom button.active{background:var(--pale);color:var(--accent);font-weight:700}.foot{margin-top:auto;padding:12px;color:var(--sub);font-size:12px}.main{max-width:1200px;width:100%;margin:auto;padding:25px 25px 95px;min-width:0}.head,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.head{justify-content:space-between;margin-bottom:24px}.muted{color:var(--sub);font-size:13px}.btn{border:0;border-radius:12px;background:var(--accent);color:white;padding:11px 15px;font-weight:650}.alt{border:1px solid var(--edge);border-radius:12px;background:var(--panel);color:var(--fg);padding:10px 13px}.card{background:var(--panel);border:1px solid var(--edge);border-radius:17px;padding:15px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.big{font-size:26px;font-weight:800;margin-top:6px}.click{cursor:pointer}.click:hover{outline:1px solid var(--accent)}.visual{height:145px;background:var(--pale);border-radius:12px;display:grid;place-items:center;font-size:45px;overflow:hidden}.visual img{width:100%;height:100%;object-fit:contain}.tag{font-size:12px;color:var(--accent);background:var(--pale);border-radius:20px;padding:5px 9px;display:inline-block}.bar{height:8px;border-radius:10px;background:var(--pale);overflow:hidden;margin-top:8px}.bar div{height:100%;background:var(--accent)}.tools{display:flex;gap:9px;margin:15px 0;flex-wrap:wrap}.tools input{flex:1;min-width:160px}.field{border:1px solid var(--edge);background:var(--panel);color:var(--fg);border-radius:10px;padding:10px;width:100%}.fieldlabel{font-size:12px;color:var(--sub);display:block;margin-bottom:4px}.form{display:grid;gap:12px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modalback{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:12px;z-index:30}.modal{background:var(--panel);border-radius:18px;padding:22px;width:min(600px,100%);max-height:90vh;overflow:auto}.hidden{display:none}.bottom{display:none}.empty{padding:35px;text-align:center;border:1px dashed var(--edge);border-radius:16px;background:var(--panel)}.tablebox{overflow:auto}table{width:100%;border-collapse:collapse;background:var(--panel)}td,th{padding:10px;border-bottom:1px solid var(--edge);text-align:left;white-space:nowrap}.banner{padding:14px;background:var(--pale);border-radius:12px;font-size:13px}#toast{position:fixed;bottom:25px;right:20px;background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:12px;display:none;z-index:40}

</style></head><body data-theme="purple"><div class="app"><aside class="nav"><div class="logo">💜 Моя колекція</div><div id="side"></div><div class="foot">Версія <b id="sideVersion"></b><br>Особисте локальне сховище</div></aside><main class="main"><header class="head"><div><h1 id="heading">Моя колекція</h1><span class="muted">Твій персональний цифровий музей</span></div><div class="row"><button class="alt" id="share">↗ Поділитися</button><button class="btn" id="add">+ Додати предмет</button></div></header><div id="content"></div></main></div><nav id="bottom" class="bottom"></nav><div id="modal" class="hidden"></div><div id="toast" role="status"></div><input type="file" id="backupfile" accept=".json,application/json" hidden>
<script>
const VERSION='0.9.1', menu=[['home','⌂','Головна'],['collections','▣','Колекції'],['wishes','♡','Бажанки'],['search','⌕','Пошук'],['stats','▥','Статистика'],['settings','⚙','Налаштування']],themes=[['purple','Фіолетова'],['light','Світла'],['dark','Темна'],['mint',"М’ятна"],['pink','Рожева'],['blue','Блакитна']];
const $=x=>document.getElementById(x), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>crypto.randomUUID(),now=()=>new Date().toISOString(),fmt=x=>x===''||x==null?'—':Number(x).toLocaleString('uk-UA',{maximumFractionDigits:2})+' '+data.settings.currency;
let db,data={folders:[],items:[],settings:{theme:'purple',currency:'UAH'}},page='home',folder=null,searchTerm='',view='cards',discoveryMode='character';
const validPages=new Set(menu.map(x=>x[0]));
function routeUrl(p,f){return '#'+encodeURIComponent(p)+(p==='collections'&&f?'/' + encodeURIComponent(f):'')}
function routeFromUrl(){let parts=location.hash.slice(1).split('/'),p=decodeURIComponent(parts[0]||'home');return {page:validPages.has(p)?p:'home',folder:p==='collections'&&parts[1]?decodeURIComponent(parts[1]):null}}
function applyRoute(){let r=routeFromUrl();page=r.page;folder=r.folder;searchTerm='';render()}
window.addEventListener('popstate',()=>{try{applyRoute()}catch(e){showStartupError(e)}});
window.addEventListener('hashchange',()=>{if(routeUrl(page,folder)!==location.hash)applyRoute()});
function opendb(){return new Promise((r,j)=>{let q=indexedDB.open('moya-kolektsiya',1);q.onupgradeneeded=()=>q.result.createObjectStore('store');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}
function load(){return new Promise((r,j)=>{let q=db.transaction('store').objectStore('store').get('main');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}
function save(){return new Promise((r,j)=>{let t=db.transaction('store','readwrite');t.objectStore('store').put(data,'main');t.oncomplete=r;t.onerror=()=>j(t.error)})}
const getfolder=x=>data.folders.find(f=>f.id===x),owned=x=>x.status==='owned'&&Number(x.quantity)>0;
function tree(x){let a=[x];for(let i=0;i<a.length;i++)a.push(...data.folders.filter(f=>f.parent===a[i]).map(f=>f.id));return a}
function showToast(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2700)}
function navigate(p,f){if(!validPages.has(p))p='home';let nextFolder=p==='collections'?(f!==undefined?f:page==='collections'?folder:null):null;let target=routeUrl(p,nextFolder);if(target!==location.hash)history.pushState({page:p,folder:nextFolder},'',target);page=p;folder=nextFolder;searchTerm='';render();window.scrollTo(0,0)}
function metric(){let items=data.items.filter(owned);return {have:items.length,spent:items.reduce((v,i)=>v+((i.purchasePrice===''||i.purchasePrice==null)?0:Number(i.purchasePrice)*Number(i.quantity||1)),0),market:items.reduce((v,i)=>v+((i.marketPrice===''||i.marketPrice==null)?0:Number(i.marketPrice)*Number(i.quantity||1)),0),priced:items.filter(i=>i.marketPrice!==''&&i.marketPrice!=null).length}}
function foldercard(f){let ids=tree(f.id),items=data.items.filter(i=>ids.includes(i.folder)),n=items.filter(owned).length;return '<div class="card click" data-folder="'+esc(f.id)+'"><div class="visual">'+(f.photo?'<img alt="" src="'+esc(f.photo)+'">':'📁')+'</div><h3>'+esc(f.name)+'</h3><span class="muted">'+n+' / '+items.length+' у наявності</span><div class="bar"><div style="width:'+(items.length?100*n/items.length:0)+'%"></div></div></div>'}
async function toggleOwnedItem(itemId){let item=data.items.find(i=>i.id===itemId);if(!item)return showToast('Предмет не знайдено');let old={status:item.status,quantity:item.quantity,previousStatus:item.previousStatus,updated:item.updated};if(owned(item)){item.status=item.previousStatus&&item.previousStatus!=='owned'?item.previousStatus:'wish';item.quantity=0;delete item.previousStatus}else{item.previousStatus=item.status==='owned'?'wish':item.status;item.status='owned';item.quantity=Math.max(1,Number(item.quantity)||0)}item.updated=now();try{await save()}catch(e){item.status=old.status;item.quantity=old.quantity;item.updated=old.updated;if(old.previousStatus===undefined)delete item.previousStatus;else item.previousStatus=old.previousStatus;showToast('Не вдалося зберегти позначку');return}render();showToast(owned(item)?'✓ Позначено як придбане':'Позначку «Маю» знято')}
function itemcard(i){let have=owned(i);return '<div class="card click item-collectible '+(have?'item-owned':'')+'" data-item="'+esc(i.id)+'"><div class="visual">'+(i.photo?'<img alt="" src="'+esc(i.photo)+'">':'📦')+'</div>'+(i.sourceUrl&&!i.photo?'<a class="source-photo-link" href="'+esc(i.sourceUrl)+'" target="_blank" rel="noopener noreferrer" data-source-link="'+esc(i.id)+'">🖼 Переглянути фото ↗</a>':'')+'<h3>'+esc(i.name)+'</h3><div class="muted">'+(i.figureNumber?'№ '+esc(i.figureNumber):i.catalogPosition?'Позиція '+esc(i.catalogPosition):'№ —')+' · '+esc(i.manufacturer||'—')+'</div><div class="item-status-row"><span class="tag">'+({owned:'✓ Маю',wish:'♡ Хочу',ordered:'🚚 Замовлено',skip:'Не цікавить'}[i.status]||'Немає')+'</span><button type="button" class="owned-toggle '+(have?'is-owned':'')+'" data-toggle-owned="'+esc(i.id)+'" aria-pressed="'+have+'" aria-label="'+(have?'Зняти позначку придбання: ':'Позначити як маю: ')+esc(i.name)+'">'+(have?'✓ Є':'○ Маю')+'</button></div></div>'}
function cards(arr){return arr.length?(view==='cards'?'<div class="grid">'+arr.map(itemcard).join('')+'</div>':'<div class="tablebox"><table><tr><th>Назва</th><th>№</th><th>№ серії</th><th>Кількість</th><th>Наявність</th><th>Ринкова ціна</th><th>Маю</th></tr>'+arr.map(i=>'<tr class="click '+(owned(i)?'owned-row':'')+'" data-item="'+esc(i.id)+'"><td>'+esc(i.name)+'</td><td>'+esc(i.figureNumber)+'</td><td>'+esc(i.seriesNumber)+'</td><td>'+esc(i.quantity)+'</td><td>'+esc(i.status)+'</td><td>'+fmt(i.marketPrice)+'</td><td><button type="button" class="owned-toggle '+(owned(i)?'is-owned':'')+'" data-toggle-owned="'+esc(i.id)+'" aria-pressed="'+owned(i)+'">'+(owned(i)?'✓ Є':'○ Маю')+'</button></td></tr>').join('')+'</table></div>'):'<div class="empty">Тут поки нічого немає</div>'}
function countCollections(){return data.folders.filter(f=>f.kind==='series'||(f.kind!=='category'&&f.parent&&!data.folders.some(child=>child.parent===f.id))).length}
function home(){let s=metric(),root=data.folders.filter(f=>!f.parent);return '<div class="stats">'+[['📦 У наявності',s.have],['▣ Серій',countCollections()],['♡ Бажанки',data.items.filter(i=>i.status==='wish').length],['₴ Ринкова вартість',fmt(s.market)]].map(x=>'<div class="card"><span class="muted">'+x[0]+'</span><div class="big">'+esc(x[1])+'</div></div>').join('')+'</div><h2>Швидкі дії</h2><div class="tools"><button class="btn" data-action="new-item">+ Предмет</button><button class="alt" data-action="new-folder">+ Папка</button><button class="alt" data-action="scan">▤ Штрихкод</button><button class="alt" data-action="backup">↓ Резервна копія</button></div><h2>Колекції</h2><div class="grid">'+root.map(foldercard).join('')+'</div>'+(root.length?'':'<div class="empty">Створи першу папку для своєї серії</div>')+'<h2>Останні придбання</h2>'+cards(data.items.filter(owned).slice().sort((a,b)=>(b.updated||'').localeCompare(a.updated||'')).slice(0,4))}
function collections(){if(folder&&!getfolder(folder)){folder=null;history.replaceState({page:'collections',folder:null},'',routeUrl('collections',null))}const current=getfolder(folder),subfolders=data.folders.filter(f=>f.parent===folder),items=folder?data.items.filter(i=>i.folder===folder&&[i.name,i.figureNumber,i.seriesNumber,i.manufacturer].join(' ').toLowerCase().includes(searchTerm.toLowerCase())):[];let breadcrumb='<div class="crumbline"><button class="backlink" data-action="up">‹</button><span class="muted">Колекції</span>'+(current?.parent?'<span class="muted">/</span><span class="crumbname">'+esc(getfolder(current.parent)?.name||'Категорія')+'</span>':'')+'</div>';let actions='<div class="collection-actions"><button class="btn" data-action="new-folder">＋ Нова папка</button><button class="alt" data-action="browse-directory">▣ Каталог серій</button><button class="alt" data-action="find-collection">⌕ Фото / пошук</button>'+(current?'<button class="alt folder-edit" data-action="edit-folder" title="Редагувати папку" aria-label="Редагувати папку">⋯</button>':'')+'</div>';let fillAction=current?'<div class="tools"><button class="alt" data-action="fill-collection">⇩ Заповнити колекцію</button>'+(catalogForFolder(current)?'<button class="btn" data-action="enrich-collection">✦ Додати фото й деталі</button>':'')+'</div>':'';let title='<div class="section-head"><div><h2>'+esc(current?.name||'Мої колекції')+'</h2><span class="muted">'+(subfolders.length?subfolders.length+' папок':'Папок поки немає')+(items.length?' · '+items.length+' предметів':'')+'</span></div></div>';let foldersHtml=subfolders.length?'<div class="grid foldergrid">'+subfolders.map(foldercard).join('')+'</div>':'';if(!folder)return '<section class="collections-page">'+actions+title+(subfolders.length?foldersHtml:'<div class="empty neat-empty">Створи першу папку, щоб почати колекцію.</div>')+'</section>';let objects=items.length?'<section class="items-section"><div class="section-head"><h2>Предмети <span class="muted">('+items.length+')</span></h2></div><div class="tools item-tools"><input class="field" id="localquery" placeholder="Пошук предметів" value="'+esc(searchTerm)+'"><button class="alt" data-action="view">'+(view==='cards'?'☷ Таблиця':'▦ Картки')+'</button><button class="alt" data-action="checklist">☑ Чекліст</button></div>'+cards(items)+'</section>':(!subfolders.length?'<div class="empty neat-empty"><p>У цій серії ще немає предметів.</p><button class="btn" data-action="new-item">＋ Додати предмет</button></div>':'');return '<section class="collections-page">'+breadcrumb+title+actions+fillAction+foldersHtml+objects+'</section>'}

async function createDiscoveredFolder(name,parent,source){name=String(name||'').trim();if(!name)return showToast('Назву не визначено');let duplicate=data.folders.find(f=>f.parent===(parent||null)&&f.name.toLocaleLowerCase('uk-UA')===name.toLocaleLowerCase('uk-UA'));if(duplicate){close();navigate('collections',duplicate.id);showToast('Така підпапка вже існує — відкрито її');return}
let created={id:id(),name,parent:parent||null,photo:'',source:source||'',created:now()};data.folders.push(created);try{await save()}catch(error){data.folders=data.folders.filter(f=>f.id!==created.id);return showToast('Не вдалося зберегти підпапку: '+error.message)}close();navigate('collections',created.id);showToast('Підпапку «'+name+'» створено')}

function parseCollectionLines(text){return String(text||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map(line=>{let fields=line.includes('|')?line.split('|').map(x=>x.trim()):[line];let number='',name='',manufacturer='';if(fields.length>1&&/^(?:#|№\s*)?\d+[A-Za-z-]*$/.test(fields[0])){number=fields[0].replace(/^[#№]\s*/,'');name=fields[1]||'';manufacturer=fields[2]||''}else if(fields.length>1){name=fields[0];number=fields[1]||'';manufacturer=fields[2]||''}else{name=line}return {name,figureNumber:number,manufacturer}}).filter(x=>x.name).slice(0,500)}

function normalizeCatalogUrl(url){try{let u=new URL(url);return ['https:','http:'].includes(u.protocol)?u:null}catch{return null}}
function extractCatalogItems(html,base){let doc=new DOMParser().parseFromString(html,'text/html'),out=[];let add=(name,number,manufacturer,image)=>{name=String(name||'').trim().replace(/\s+/g,' ').slice(0,180);number=String(number||'').trim().slice(0,60);manufacturer=String(manufacturer||'').trim().slice(0,90);if(!name||name.length<2)return;let photo='';if(image)try{let u=new URL(String(image),base);if(u.protocol==='https:'||u.protocol==='http:')photo=u.href}catch{}out.push({name,figureNumber:number,manufacturer,photo})};
const walk=obj=>{if(!obj||typeof obj!=='object'||out.length>500)return;if(Array.isArray(obj)){obj.forEach(walk);return}let type=String(obj['@type']||'').toLowerCase();if(type.includes('product')){let brand=obj.brand?.name||obj.brand||'';let image=Array.isArray(obj.image)?obj.image[0]:obj.image;add(obj.name,obj.sku||obj.mpn||'',typeof brand==='string'?brand:'',typeof image==='string'?image:image?.url||'')}if(type.includes('itemlist'))walk(obj.itemListElement);if(obj.item)walk(obj.item);if(obj['@graph'])walk(obj['@graph']);if(obj.mainEntity)walk(obj.mainEntity)};
doc.querySelectorAll('script[type="application/ld+json"]').forEach(el=>{try{walk(JSON.parse(el.textContent))}catch{}});
if(!out.length){for(let row of doc.querySelectorAll('table tr')){let cells=[...row.querySelectorAll('td')].map(x=>x.textContent.trim());if(cells.length>=2&&cells.length<=6){let first=cells[0],second=cells[1];if(/^(#|№)?\s*\d{1,8}[a-z]?$/i.test(first))add(second,first,cells[2]||'',row.querySelector('img')?.getAttribute('src'));else if(first.length>=3&&first.length<130)add(first,/^(#|№)?\s*\d{1,8}/.test(second)?second:'',cells[2]||'',row.querySelector('img')?.getAttribute('src'))}}}
let seen=new Set;return out.filter(i=>{let key=(i.name+'|'+i.figureNumber).toLocaleLowerCase('uk-UA');if(seen.has(key))return false;seen.add(key);return true}).slice(0,500)}

function findSeriesSuggestions(){let q=$('folderDiscoveryQuery')?.value.trim(),box=$('seriesResults');if(!q)return showToast('Введи персонажа, номер або виробника');let urls=[['Офіційний каталог Funko','https://funko.com/search/?term='+encodeURIComponent(q)],['Фігурки та серії (пошук)','https://www.google.com/search?q='+encodeURIComponent(q+' collectible figure series catalog')],['Фотографії фігурок','https://www.google.com/search?tbm=isch&q='+encodeURIComponent(q+' collectible figure')]];box.innerHTML='<p class="muted">Відкрий результати пошуку, перевір назву серії, а потім введи підтверджену назву нижче. Не створюємо папку за назвою випадкової статті.</p>'+urls.map((x,i)=>'<button type="button" class="alt" data-search-source="'+i+'" style="display:block;width:100%;text-align:left;margin:7px 0">↗ '+esc(x[0])+'</button>').join('');box.querySelectorAll('[data-search-source]').forEach(b=>b.onclick=()=>window.open(urls[Number(b.dataset.searchSource)][1],'_blank','noopener,noreferrer'))}

if(!fid){$('findInsideFolder').onclick=()=>$('folderDiscovery').classList.toggle('hidden');$('discoverSuggestions').onclick=findSeriesSuggestions;$('folderDiscoveryQuery').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();findSeriesSuggestions()}};$('discoverWeb').onclick=()=>{let q=$('folderDiscoveryQuery').value.trim();if(!q)return showToast('Введи запит');window.open('https://funko.com/search/?term='+encodeURIComponent(q),'_blank','noopener,noreferrer')};$('discoverPictures').onclick=()=>{let q=$('folderDiscoveryQuery').value.trim();if(!q)return showToast('Введи назву або опис для пошуку фотографій');window.open('https://www.google.com/search?tbm=isch&q='+encodeURIComponent(q+' collectible figures'),'_blank','noopener,noreferrer')}}
$('folderform').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target),name=String(fd.get('name')).trim();if(!name)return showToast('Вкажи назву');let o={...f,id:fid||id(),name,parent:String(fd.get('parent')||'')||null,photo:f.photo||''};if(data.folders.some(x=>x.id!==fid&&x.parent===o.parent&&x.name.toLocaleLowerCase('uk-UA')===name.toLocaleLowerCase('uk-UA')))return showToast('У цій папці така серія вже є');if(fd.get('photo')?.size)try{o.photo=await img(fd.get('photo'))}catch(err){return showToast(err.message)}if(fid)Object.assign(f,o);else data.folders.push(o);await save();close();render();showToast('Папку збережено')};if(fid)$('removefolder').onclick=async()=>{let ids=tree(fid);if(!confirm('Видалити цю папку, всі підпапки та предмети?'))return;data.folders=data.folders.filter(f=>!ids.includes(f.id));data.items=data.items.filter(i=>!ids.includes(i.folder));folder=null;await save();close();render()}}
function viewitem(iid){let i=data.items.find(x=>x.id===iid);if(!i)return showToast('Предмет не знайдено');let status={owned:'✓ Маю',wish:'♡ Хочу',ordered:'🚚 Замовлено',skip:'Не цікавить'},conditions={unknown:'Не вказано',new:'Новий',excellent:'Відмінний',good:'Хороший',damaged:'З дефектами'};let rows=[['Назва',i.name],['Номер фігурки',i.figureNumber||'—'],['Номер серії',i.seriesNumber||'—'],['Виробник',i.manufacturer||'—'],['Папка / серія',getfolder(i.folder)?.name||'Без папки'],['Кількість',i.quantity??0],['Наявність',status[i.status]||'Не вказано'],['Стан',conditions[i.condition]||'Не вказано'],['Ціна придбання',fmt(i.purchasePrice)],['Ринкова ціна',fmt(i.marketPrice)],['Рік випуску',i.year||'—'],['Позиція у серії',i.catalogPosition||'—'],['Артикул серії',i.productSku||'—'],['Опис',i.description||'—'],['Рідкість',i.rarity||'—'],['Фото з',i.photoCredit||'—']];let photo=i.photo?'<img alt="'+esc(i.name)+'" src="'+esc(i.photo)+'" style="width:100%;max-height:330px;object-fit:contain;border-radius:12px;background:var(--pale)">':'<div class="visual" style="height:190px">📦</div>';modal(i.name,'<div class="form">'+photo+'<div class="tablebox"><table><tbody>'+rows.map(r=>'<tr><th style="width:42%;white-space:normal">'+esc(r[0])+'</th><td style="white-space:normal">'+esc(r[1])+'</td></tr>').join('')+'</tbody></table></div>'+(i.sourceUrl?'<a href="'+esc(i.sourceUrl)+'" target="_blank" rel="noopener noreferrer">Переглянути джерело та фото ↗</a>':'')+'<div class="row"><button class="btn" id="viewedit">✎ Редагувати</button><button class="alt" id="viewhistory">▥ Історія цін</button><button class="alt" id="viewclose">Закрити</button></div></div>');$('viewedit').onclick=()=>itemform(iid);$('viewhistory').onclick=()=>historyform(iid);$('viewclose').onclick=close}
function itemform(iid){let i=data.items.find(x=>x.id===iid)||{status:'wish',condition:'unknown',quantity:0,history:[]};modal(iid?'Редагувати предмет':'Новий предмет','<form id="itemform" class="form">'+inp('name','Назва *',i.name)+'<div class="pair">'+inp('figureNumber','Номер фігурки',i.figureNumber)+inp('seriesNumber','Номер серії',i.seriesNumber)+'</div>'+inp('manufacturer','Виробник',i.manufacturer)+'<label><span class="fieldlabel">Папка / серія</span><select class="field" name="folder">'+folderopts(i.folder??folder)+'</select></label><div class="pair">'+inp('quantity','Кількість',i.quantity,'number')+inp('year','Рік випуску',i.year,'number')+'</div><div class="pair"><label><span class="fieldlabel">Наявність</span><select class="field" name="status">'+[['owned','Маю'],['wish','Хочу'],['ordered','Замовлено'],['skip','Не цікавить']].map(x=>'<option value="'+x[0]+'" '+(i.status===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></label><label><span class="fieldlabel">Стан</span><select name="condition" class="field">'+[['unknown','Не вказано'],['new','Новий'],['excellent','Відмінний'],['good','Хороший'],['damaged','З дефектами']].map(x=>'<option value="'+x[0]+'" '+(i.condition===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></label></div><div class="pair">'+inp('purchasePrice','Ціна придбання / шт.',i.purchasePrice,'number')+inp('marketPrice','Ринкова ціна / шт.',i.marketPrice,'number')+'</div><label><span class="fieldlabel">Фото (до 5 МБ)</span><input class="field" name="photo" type="file" accept="image/*"></label>'+(i.photo?'<img alt="Фото" src="'+esc(i.photo)+'" style="height:90px;object-fit:contain">':'')+'<div class="row"><button class="btn">Зберегти</button>'+(iid?'<button class="alt" type="button" id="history">Історія цін</button><button class="alt" type="button" id="removeitem">Видалити</button>':'')+'</div></form>');$('itemform').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target),name=String(fd.get('name')).trim();if(!name)return showToast('Вкажи назву');let o={...i,id:iid||id(),updated:now(),history:i.history||[],name};for(let k of ['figureNumber','seriesNumber','manufacturer','folder','year','status','condition'])o[k]=String(fd.get(k)||'');o.quantity=Math.max(0,Number(fd.get('quantity')||0));if(o.status==='owned'&&o.quantity===0)o.quantity=1;for(let k of ['purchasePrice','marketPrice']){let v=fd.get(k);o[k]=v===''?'':Math.max(0,Number(v))}if(o.marketPrice!==''&&String(o.marketPrice)!==String(i.marketPrice))o.history.push({date:now().slice(0,10),price:o.marketPrice,source:'Ручне редагування'});if(fd.get('photo')?.size)try{o.photo=await img(fd.get('photo'))}catch(err){return showToast(err.message)}if(iid)Object.assign(i,o);else data.items.push(o);await save();close();render();showToast('Предмет збережено')};if(iid){$('history').onclick=()=>historyform(iid);$('removeitem').onclick=async()=>{if(!confirm('Видалити предмет?'))return;data.items=data.items.filter(x=>x.id!==iid);await save();close();render()}}}
function historyform(iid){let i=data.items.find(x=>x.id===iid);modal('Історія цін: '+i.name,'<div class="form">'+(i.history||[]).map(h=>'<div class="card">'+esc(h.date)+' · '+fmt(h.price)+' · '+esc(h.source)+'</div>').join('')+'<form id="histform" class="form">'+inp('date','Дата',now().slice(0,10),'date')+inp('price','Ринкова ціна',i.marketPrice,'number')+inp('source','Джерело','Ручна оцінка')+'<button class="btn">Додати оцінку</button></form></div>');$('histform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);if(f.get('price')==='')return showToast('Вкажи ціну');let x={date:f.get('date'),price:Math.max(0,Number(f.get('price'))),source:String(f.get('source'))};i.history??=[];i.history.push(x);i.marketPrice=x.price;await save();close();render();showToast('Оцінку збережено')}}
function checklist(){let ids=folder?tree(folder):null,items=data.items.filter(i=>!owned(i)&&(!ids||ids.includes(i.folder)));modal('Чекліст відсутніх','<div class="form">'+items.map(i=>'<div>☐ '+esc(i.name)+' · № '+esc(i.figureNumber||'—')+'</div>').join('')+'<button class="btn" id="copy">Копіювати список</button></div>');$('copy').onclick=()=>navigator.clipboard?.writeText(items.map(i=>'☐ '+i.name+' №'+(i.figureNumber||'—')).join('\n')).then(()=>showToast('Скопійовано'))}
function backup(){let blob=new Blob([JSON.stringify({app:'moya-kolektsiya',version:VERSION,created:now(),data})],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='moya-kolektsiya-'+now().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('Копію створено')}
$('backupfile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let x=JSON.parse(await file.text());if(x.app!=='moya-kolektsiya'||!Array.isArray(x.data?.folders)||!Array.isArray(x.data?.items))throw Error('Невідповідний формат');if(!confirm('Замінити всі поточні дані резервною копією?'))return;data={folders:x.data.folders,items:x.data.items,settings:{theme:'purple',currency:'UAH',...x.data.settings}};await save();navigate('home',null);showToast('Відновлено')}catch(err){showToast('Помилка імпорту: '+err.message)}e.target.value=''};

function scan(){modal('Сканування штрихкоду','<video id="video" autoplay playsinline style="width:100%;max-height:250px;background:#111;border-radius:10px"></video><p class="muted">Камера доступна лише за HTTPS і в браузерах із BarcodeDetector.</p>'+inp('code','Номер / штрихкод','')+'<div class="tools"><button class="btn" id="checkcode">Знайти</button><button class="alt" id="startcam">Увімкнути камеру</button></div>');$('checkcode').onclick=()=>{let code=document.querySelector('input[name=code]').value.trim();if(!code)return;let i=data.items.find(x=>x.figureNumber===code||x.barcode===code);close();if(i)itemform(i.id);else{itemform();document.querySelector('input[name=figureNumber]').value=code;showToast('Заповни картку вручну')}};$('startcam').onclick=async()=>{if(!('BarcodeDetector'in window)||!navigator.mediaDevices)return showToast('Сканер недоступний, введи номер');try{let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),v=$('video');v.srcObject=s;let det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']}),timer=setInterval(async()=>{if(!document.contains(v)){clearInterval(timer);s.getTracks().forEach(t=>t.stop());return}try{let r=await det.detect(v);if(r.length){document.querySelector('input[name=code]').value=r[0].rawValue;clearInterval(timer);s.getTracks().forEach(t=>t.stop());showToast('Код зчитано')}}catch{}},650)}catch{showToast('Не вдалося ввімкнути камеру')}}}
function action(a){if(a==='new-item')itemform();else if(a==='new-folder')folderform();else if(a==='find-collection')collectionScanFlow();else if(a==='browse-directory')browseSeriesDirectory();else if(a==='fill-collection')fillCollection();else if(a==='enrich-collection')enrichCollection();else if(a==='edit-folder')folderform(folder);else if(a==='up'){if(folder)navigate('collections',getfolder(folder)?.parent||null);else navigate('home')}else if(a==='view'){view=view==='cards'?'table':'cards';render()}else if(a==='checklist')checklist();else if(a==='backup')backup();else if(a==='import')$('backupfile').click();else if(a==='share')share();else if(a==='scan')scan();else if(a==='unfiled'){folder=null;itemform()}else if(['external','search-funko','search-images','lens'].includes(a)){let value=searchTerm.trim();if(a==='lens'){if(!value)return showToast('Введи назву або опис, щоб шукати зображення');window.open('https://www.google.com/search?tbm=isch&q='+encodeURIComponent(value+' collectible figures'),'_blank','noopener,noreferrer');return}if(!value)return showToast('Спочатку введи запит');let suffix={character:' collectible figures series catalog',number:' collectible figure UPC barcode catalog',description:' collectible figure identify',manufacturer:' collectibles catalog',photo:' figure identification'}[discoveryMode]||'';let q=a==='search-funko'?'site:funko.com '+value:a==='search-images'?value+' collectible figure':value+suffix;let endpoint=a==='search-images'?'https://www.google.com/search?tbm=isch&q=':'https://www.google.com/search?q=';window.open(a==='search-funko'?'https://funko.com/search/?term='+encodeURIComponent(value):endpoint+encodeURIComponent(q),'_blank','noopener,noreferrer')}}

(async()=>{emergencyNav();try{db=await opendb();let stored=await load();if(stored)data={folders:stored.folders||[],items:stored.items||[],settings:{theme:'purple',currency:'UAH',...stored.settings}};if(!location.hash)history.replaceState({page:'home',folder:null},'',routeUrl('home',null));applyRoute();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Service worker:',e))}catch(e){showStartupError(e)}})();
