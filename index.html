<script>
const VERSION='0.4.0', menu=[['home','⌂','Головна'],['collections','▣','Колекції'],['wishes','♡','Бажанки'],['search','⌕','Пошук'],['stats','▥','Статистика'],['settings','⚙','Налаштування']],themes=[['purple','Фіолетова'],['light','Світла'],['dark','Темна'],['mint',"М’ятна"],['pink','Рожева'],['blue','Блакитна']];
const $=x=>document.getElementById(x), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>crypto.randomUUID(),now=()=>new Date().toISOString(),fmt=x=>x===''||x==null?'—':Number(x).toLocaleString('uk-UA',{maximumFractionDigits:2})+' '+data.settings.currency;
let db,data={folders:[],items:[],settings:{theme:'purple',currency:'UAH'}},page='home',folder=null,searchTerm='',view='cards',discoveryMode='character';
const validPages=new Set(menu.map(x=>x[0]));
function routeUrl(p,f){return '#'+encodeURIComponent(p)+(p==='collections'&&f?'/' + encodeURIComponent(f):'')}
function routeFromUrl(){let parts=location.hash.slice(1).split('/'),p=decodeURIComponent(parts[0]||'home');return {page:validPages.has(p)?p:'home',folder:p==='collections'&&parts[1]?decodeURIComponent(parts[1]):null}}
function applyRoute(){let r=routeFromUrl();page=r.page;folder=r.folder;searchTerm='';render()}
window.addEventListener('popstate',()=>{try{applyRoute()}catch(e){showStartupError(e)}});
window.addEventListener('hashchange',()=>{if(routeUrl(page,folder)!==location.hash)applyRoute()});
function opendb(){return new Promise((r,j)=>{let q=indexedDB.open('moya-kolektsiya',1);q.onupgradeneeded=()=>q.result.createObjectStore('store');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}
function load(){return new Promise((r,j)=>{let q=db.transaction('store').objectStore('store').get('main');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}
function save(){return new Promise((r,j)=>{let t=db.transaction('store','readwrite');t.objectStore('store').put(data,'main');t.oncomplete=r;t.onerror=()=>j(t.error)})}
const getfolder=x=>data.folders.find(f=>f.id===x),owned=x=>x.status==='owned'&&Number(x.quantity)>0;
function tree(x){let a=[x];for(let i=0;i<a.length;i++)a.push(...data.folders.filter(f=>f.parent===a[i]).map(f=>f.id));return a}
function showToast(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2700)}
function navigate(p,f){if(!validPages.has(p))p='home';let nextFolder=p==='collections'?(f!==undefined?f:page==='collections'?folder:null):null;let target=routeUrl(p,nextFolder);if(target!==location.hash)history.pushState({page:p,folder:nextFolder},'',target);page=p;folder=nextFolder;searchTerm='';render();window.scrollTo(0,0)}
function metric(){let items=data.items.filter(owned);return {have:items.length,spent:items.reduce((v,i)=>v+((i.purchasePrice===''||i.purchasePrice==null)?0:Number(i.purchasePrice)*Number(i.quantity||1)),0),market:items.reduce((v,i)=>v+((i.marketPrice===''||i.marketPrice==null)?0:Number(i.marketPrice)*Number(i.quantity||1)),0),priced:items.filter(i=>i.marketPrice!==''&&i.marketPrice!=null).length}}
function foldercard(f){let ids=tree(f.id),items=data.items.filter(i=>ids.includes(i.folder)),n=items.filter(owned).length;return '<div class="card click" data-folder="'+esc(f.id)+'"><div class="visual">'+(f.photo?'<img alt="" src="'+esc(f.photo)+'">':'📁')+'</div><h3>'+esc(f.name)+'</h3><span class="muted">'+n+' / '+items.length+' у наявності</span><div class="bar"><div style="width:'+(items.length?100*n/items.length:0)+'%"></div></div></div>'}
function itemcard(i){return '<div class="card click" data-item="'+esc(i.id)+'"><div class="visual">'+(i.photo?'<img alt="" src="'+esc(i.photo)+'">':'📦')+'</div><h3>'+esc(i.name)+'</h3><div class="muted">№ '+esc(i.figureNumber||'—')+' · '+esc(i.manufacturer||'—')+'</div><p><span class="tag">'+({owned:'✓ Маю',wish:'♡ Хочу',ordered:'🚚 Замовлено',skip:'Не цікавить'}[i.status]||'Немає')+'</span></p></div>'}
function cards(arr){return arr.length?(view==='cards'?'<div class="grid">'+arr.map(itemcard).join('')+'</div>':'<div class="tablebox"><table><tr><th>Назва</th><th>№</th><th>№ серії</th><th>Кількість</th><th>Наявність</th><th>Ринкова ціна</th></tr>'+arr.map(i=>'<tr class="click" data-item="'+esc(i.id)+'"><td>'+esc(i.name)+'</td><td>'+esc(i.figureNumber)+'</td><td>'+esc(i.seriesNumber)+'</td><td>'+esc(i.quantity)+'</td><td>'+esc(i.status)+'</td><td>'+fmt(i.marketPrice)+'</td></tr>').join('')+'</table></div>'):'<div class="empty">Тут поки нічого немає</div>'}
function countCollections(){return data.folders.filter(f=>f.kind==='series'||(f.kind!=='category'&&f.parent&&!data.folders.some(child=>child.parent===f.id))).length}
function home(){let s=metric(),root=data.folders.filter(f=>!f.parent);return '<div class="stats">'+[['📦 У наявності',s.have],['▣ Серій',countCollections()],['♡ Бажанки',data.items.filter(i=>i.status==='wish').length],['₴ Ринкова вартість',fmt(s.market)]].map(x=>'<div class="card"><span class="muted">'+x[0]+'</span><div class="big">'+esc(x[1])+'</div></div>').join('')+'</div><h2>Швидкі дії</h2><div class="tools"><button class="btn" data-action="new-item">+ Предмет</button><button class="alt" data-action="new-folder">+ Папка</button><button class="alt" data-action="scan">▤ Штрихкод</button><button class="alt" data-action="backup">↓ Резервна копія</button></div><h2>Колекції</h2><div class="grid">'+root.map(foldercard).join('')+'</div>'+(root.length?'':'<div class="empty">Створи першу папку для своєї серії</div>')+'<h2>Останні придбання</h2>'+cards(data.items.filter(owned).slice().sort((a,b)=>(b.updated||'').localeCompare(a.updated||'')).slice(0,4))}
function collections(){if(folder&&!getfolder(folder)){folder=null;history.replaceState({page:'collections',folder:null},'',routeUrl('collections',null))}const current=getfolder(folder),subfolders=data.folders.filter(f=>f.parent===folder),items=folder?data.items.filter(i=>i.folder===folder&&[i.name,i.figureNumber,i.seriesNumber,i.manufacturer].join(' ').toLowerCase().includes(searchTerm.toLowerCase())):[];let ancestors=[],cursor=current;while(cursor&&ancestors.length<30){ancestors.unshift(cursor);cursor=getfolder(cursor.parent)}let breadcrumb='<div class="crumbline"><button class="backlink" data-action="up">‹</button><span class="muted">Колекції</span>'+ancestors.map(f=>'<span class="muted">/</span><span class="crumbname">'+esc(f.name)+'</span>').join('')+'</div>';let actions='<div class="collection-actions"><button class="btn" data-action="new-folder">＋ Нова папка</button><button class="alt" data-action="find-collection">⌕ Знайти колекцію</button>'+(current?'<button class="alt folder-edit" data-action="edit-folder" title="Редагувати папку" aria-label="Редагувати папку">⋯</button>':'')+'</div>';let title='<div class="section-head"><div><h2>'+esc(current?.name||'Мої колекції')+'</h2><span class="muted">'+(subfolders.length?subfolders.length+' папок':'Папок поки немає')+(items.length?' · '+items.length+' предметів':'')+'</span></div></div>';let foldersHtml=subfolders.length?'<div class="grid foldergrid">'+subfolders.map(foldercard).join('')+'</div>':'';if(!folder)return '<section class="collections-page">'+actions+title+(subfolders.length?foldersHtml:'<div class="empty neat-empty">Створи першу папку, щоб почати колекцію.</div>')+'</section>';let objects=items.length?'<section class="items-section"><div class="section-head"><h2>Предмети <span class="muted">('+items.length+')</span></h2></div><div class="tools item-tools"><input class="field" id="localquery" placeholder="Пошук предметів" value="'+esc(searchTerm)+'"><button class="alt" data-action="view">'+(view==='cards'?'☷ Таблиця':'▦ Картки')+'</button><button class="alt" data-action="checklist">☑ Чекліст</button></div>'+cards(items)+'</section>':(!subfolders.length?'<div class="empty neat-empty"><p>У цій серії ще немає предметів.</p><button class="btn" data-action="new-item">＋ Додати предмет</button></div>':'');return '<section class="collections-page">'+breadcrumb+actions+title+foldersHtml+objects+'</section>'}
function wishes(){return '<h2>Хочу придбати</h2>'+cards(data.items.filter(i=>i.status==='wish'))+'<h2>Замовлено</h2>'+cards(data.items.filter(i=>i.status==='ordered'))}
function searching(){let options=[['character','Персонаж / всесвіт'],['number','Номер / штрихкод'],['description','Опис предмета'],['manufacturer','Виробник / тип'],['photo','Пошук за фото']];let placeholders={character:'Наприклад: Doctor Who, Десятий Доктор',number:'Наприклад: 1966 або EAN',description:'Наприклад: біла фігурка дракона з крилами',manufacturer:'Наприклад: Funko POP Doctor Who',photo:'Опиши предмет, який видно на фото'};let q=searchTerm.trim().toLocaleLowerCase('uk-UA'),tokens=q.split(/\s+/).filter(Boolean),items=data.items.filter(i=>{let t=[i.name,i.figureNumber,i.seriesNumber,i.manufacturer,getfolder(i.folder)?.name].join(' ').toLocaleLowerCase('uk-UA');return tokens.every(x=>t.includes(x))});let matchingFolders=data.folders.filter(f=>tokens.length&&tokens.every(x=>f.name.toLocaleLowerCase('uk-UA').includes(x)));return '<div class="card form"><h2 style="margin:0">🔎 Знайти колекцію</h2><p class="muted" style="margin:0">Не обов’язково знати назву серії. Шукай за тим, що тобі відомо.</p><label><span class="fieldlabel">Спосіб пошуку</span><select id="discoveryMode" class="field">'+options.map(x=>'<option value="'+x[0]+'" '+(discoveryMode===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></label><label><span class="fieldlabel">Що шукаємо?</span><input id="globalquery" class="field" placeholder="'+esc(placeholders[discoveryMode])+'" value="'+esc(searchTerm)+'"></label>'+(discoveryMode==='photo'?'<div class="banner">📷 Вибери фото, щоб перевірити його та скористатися зовнішнім сервісом візуального пошуку. Автоматичне розпізнавання фото всередині застосунку поки недоступне — зображення не завантажується на сервер автоматично.</div><input id="discoveryPhoto" type="file" accept="image/*" class="field"><div id="discoveryPreview"></div><button class="alt" data-action="lens">Відкрити Google Lens ↗</button>':'')+'<div class="tools"><button class="btn" data-action="external">🌐 Пошук серій в інтернеті</button><button class="alt" data-action="search-funko">Шукати Funko</button><button class="alt" data-action="search-images">Пошук зображень</button></div><div class="banner">Зовнішні кнопки відкривають реальні результати пошукової системи. Перевір назву, виробника й номер перед додаванням. Автоматичне імпортування без перевіреного джерела ще не реалізовано.</div></div><h2>Знайдені папки в моєму каталозі ('+matchingFolders.length+')</h2>'+(matchingFolders.length?'<div class="grid">'+matchingFolders.map(foldercard).join('')+'</div>':'<p class="muted">Немає відповідних папок або ще не введено запит.</p>')+'<h2>Знайдені предмети ('+items.length+')</h2>'+cards(items)+'<h2>Не знаю назви серії</h2><div class="card form"><div class="muted">Можеш додати фігурку без папки. Коли визначиш серію, відкрий картку → Редагувати та вибери папку. Фото, історія цін і позначки залишаться.</div><div class="row"><button class="btn" data-action="unfiled">+ Додати без папки</button><button class="alt" data-action="new-folder">+ Створити серію</button></div></div>'}

function viewitem(iid){let i=data.items.find(x=>x.id===iid);if(!i)return showToast('Предмет не знайдено');let status={owned:'✓ Маю',wish:'♡ Хочу',ordered:'🚚 Замовлено',skip:'Не цікавить'},conditions={unknown:'Не вказано',new:'Новий',excellent:'Відмінний',good:'Хороший',damaged:'З дефектами'};let rows=[['Назва',i.name],['Номер фігурки',i.figureNumber||'—'],['Номер серії',i.seriesNumber||'—'],['Виробник',i.manufacturer||'—'],['Папка / серія',getfolder(i.folder)?.name||'Без папки'],['Кількість',i.quantity??0],['Наявність',status[i.status]||'Не вказано'],['Стан',conditions[i.condition]||'Не вказано'],['Ціна придбання',fmt(i.purchasePrice)],['Ринкова ціна',fmt(i.marketPrice)],['Рік випуску',i.year||'—']];let photo=i.photo?'<img alt="'+esc(i.name)+'" src="'+esc(i.photo)+'" style="width:100%;max-height:330px;object-fit:contain;border-radius:12px;background:var(--pale)">':'<div class="visual" style="height:190px">📦</div>';modal(i.name,'<div class="form">'+photo+'<div class="tablebox"><table><tbody>'+rows.map(r=>'<tr><th style="width:42%;white-space:normal">'+esc(r[0])+'</th><td style="white-space:normal">'+esc(r[1])+'</td></tr>').join('')+'</tbody></table></div><div class="row"><button class="btn" id="viewedit">✎ Редагувати</button><button class="alt" id="viewhistory">▥ Історія цін</button><button class="alt" id="viewclose">Закрити</button></div></div>');$('viewedit').onclick=()=>itemform(iid);$('viewhistory').onclick=()=>historyform(iid);$('viewclose').onclick=close}
function itemform(iid){let i=data.items.find(x=>x.id===iid)||{status:'wish',condition:'unknown',quantity:0,history:[]};modal(iid?'Редагувати предмет':'Новий предмет','<form id="itemform" class="form">'+inp('name','Назва *',i.name)+'<div class="pair">'+inp('figureNumber','Номер фігурки',i.figureNumber)+inp('seriesNumber','Номер серії',i.seriesNumber)+'</div>'+inp('manufacturer','Виробник',i.manufacturer)+'<label><span class="fieldlabel">Папка / серія</span><select class="field" name="folder">'+folderopts(i.folder??folder)+'</select></label><div class="pair">'+inp('quantity','Кількість',i.quantity,'number')+inp('year','Рік випуску',i.year,'number')+'</div><div class="pair"><label><span class="fieldlabel">Наявність</span><select class="field" name="status">'+[['owned','Маю'],['wish','Хочу'],['ordered','Замовлено'],['skip','Не цікавить']].map(x=>'<option value="'+x[0]+'" '+(i.status===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></label><label><span class="fieldlabel">Стан</span><select name="condition" class="field">'+[['unknown','Не вказано'],['new','Новий'],['excellent','Відмінний'],['good','Хороший'],['damaged','З дефектами']].map(x=>'<option value="'+x[0]+'" '+(i.condition===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></label></div><div class="pair">'+inp('purchasePrice','Ціна придбання / шт.',i.purchasePrice,'number')+inp('marketPrice','Ринкова ціна / шт.',i.marketPrice,'number')+'</div><label><span class="fieldlabel">Фото (до 5 МБ)</span><input class="field" name="photo" type="file" accept="image/*"></label>'+(i.photo?'<img alt="Фото" src="'+esc(i.photo)+'" style="height:90px;object-fit:contain">':'')+'<div class="row"><button class="btn">Зберегти</button>'+(iid?'<button class="alt" type="button" id="history">Історія цін</button><button class="alt" type="button" id="removeitem">Видалити</button>':'')+'</div></form>');$('itemform').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target),name=String(fd.get('name')).trim();if(!name)return showToast('Вкажи назву');let o={...i,id:iid||id(),updated:now(),history:i.history||[],name};for(let k of ['figureNumber','seriesNumber','manufacturer','folder','year','status','condition'])o[k]=String(fd.get(k)||'');o.quantity=Math.max(0,Number(fd.get('quantity')||0));if(o.status==='owned'&&o.quantity===0)o.quantity=1;for(let k of ['purchasePrice','marketPrice']){let v=fd.get(k);o[k]=v===''?'':Math.max(0,Number(v))}if(o.marketPrice!==''&&String(o.marketPrice)!==String(i.marketPrice))o.history.push({date:now().slice(0,10),price:o.marketPrice,source:'Ручне редагування'});if(fd.get('photo')?.size)try{o.photo=await img(fd.get('photo'))}catch(err){return showToast(err.message)}if(iid)Object.assign(i,o);else data.items.push(o);await save();close();render();showToast('Предмет збережено')};if(iid){$('history').onclick=()=>historyform(iid);$('removeitem').onclick=async()=>{if(!confirm('Видалити предмет?'))return;data.items=data.items.filter(x=>x.id!==iid);await save();close();render()}}}
function historyform(iid){let i=data.items.find(x=>x.id===iid);modal('Історія цін: '+i.name,'<div class="form">'+(i.history||[]).map(h=>'<div class="card">'+esc(h.date)+' · '+fmt(h.price)+' · '+esc(h.source)+'</div>').join('')+'<form id="histform" class="form">'+inp('date','Дата',now().slice(0,10),'date')+inp('price','Ринкова ціна',i.marketPrice,'number')+inp('source','Джерело','Ручна оцінка')+'<button class="btn">Додати оцінку</button></form></div>');$('histform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);if(f.get('price')==='')return showToast('Вкажи ціну');let x={date:f.get('date'),price:Math.max(0,Number(f.get('price'))),source:String(f.get('source'))};i.history??=[];i.history.push(x);i.marketPrice=x.price;await save();close();render();showToast('Оцінку збережено')}}
function checklist(){let ids=folder?tree(folder):null,items=data.items.filter(i=>!owned(i)&&(!ids||ids.includes(i.folder)));modal('Чекліст відсутніх','<div class="form">'+items.map(i=>'<div>☐ '+esc(i.name)+' · № '+esc(i.figureNumber||'—')+'</div>').join('')+'<button class="btn" id="copy">Копіювати список</button></div>');$('copy').onclick=()=>navigator.clipboard?.writeText(items.map(i=>'☐ '+i.name+' №'+(i.figureNumber||'—')).join('\n')).then(()=>showToast('Скопійовано'))}
function backup(){let blob=new Blob([JSON.stringify({app:'moya-kolektsiya',version:VERSION,created:now(),data})],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='moya-kolektsiya-'+now().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('Копію створено')}
$('backupfile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let x=JSON.parse(await file.text());if(x.app!=='moya-kolektsiya'||!Array.isArray(x.data?.folders)||!Array.isArray(x.data?.items))throw Error('Невідповідний формат');if(!confirm('Замінити всі поточні дані резервною копією?'))return;data={folders:x.data.folders,items:x.data.items,settings:{theme:'purple',currency:'UAH',...x.data.settings}};await save();navigate('home',null);showToast('Відновлено')}catch(err){showToast('Помилка імпорту: '+err.message)}e.target.value=''};
async function share(){try{if(navigator.share){await navigator.share({title:'Моя колекція',url:location.href});return}await navigator.clipboard.writeText(location.href);showToast('Посилання скопійовано')}catch(err){if(err.name!=='AbortError')showToast('Скопіюй адресу з браузера')}}
function scan(){modal('Сканування штрихкоду','<video id="video" autoplay playsinline style="width:100%;max-height:250px;background:#111;border-radius:10px"></video><p class="muted">Камера доступна лише за HTTPS і в браузерах із BarcodeDetector.</p>'+inp('code','Номер / штрихкод','')+'<div class="tools"><button class="btn" id="checkcode">Знайти</button><button class="alt" id="startcam">Увімкнути камеру</button></div>');$('checkcode').onclick=()=>{let code=document.querySelector('input[name=code]').value.trim();if(!code)return;let i=data.items.find(x=>x.figureNumber===code||x.barcode===code);close();if(i)itemform(i.id);else{itemform();document.querySelector('input[name=figureNumber]').value=code;showToast('Заповни картку вручну')}};$('startcam').onclick=async()=>{if(!('BarcodeDetector'in window)||!navigator.mediaDevices)return showToast('Сканер недоступний, введи номер');try{let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),v=$('video');v.srcObject=s;let det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']}),timer=setInterval(async()=>{if(!document.contains(v)){clearInterval(timer);s.getTracks().forEach(t=>t.stop());return}try{let r=await det.detect(v);if(r.length){document.querySelector('input[name=code]').value=r[0].rawValue;clearInterval(timer);s.getTracks().forEach(t=>t.stop());showToast('Код зчитано')}}catch{}},650)}catch{showToast('Не вдалося ввімкнути камеру')}}}
function action(a){if(a==='new-item')itemform();else if(a==='new-folder')folderform();else if(a==='find-collection')collectionScanFlow();else if(a==='edit-folder')folderform(folder);else if(a==='up'){if(folder)navigate('collections',getfolder(folder)?.parent||null);else navigate('home')}else if(a==='view'){view=view==='cards'?'table':'cards';render()}else if(a==='checklist')checklist();else if(a==='backup')backup();else if(a==='import')$('backupfile').click();else if(a==='share')share();else if(a==='scan')scan();else if(a==='unfiled'){folder=null;itemform()}else if(['external','search-funko','search-images','lens'].includes(a)){let value=searchTerm.trim();if(a==='lens'){if(!value)return showToast('Введи назву або опис, щоб шукати зображення');window.open('https://www.google.com/search?tbm=isch&q='+encodeURIComponent(value+' collectible figures'),'_blank','noopener,noreferrer');return}if(!value)return showToast('Спочатку введи запит');let suffix={character:' collectible figures series catalog',number:' collectible figure UPC barcode catalog',description:' collectible figure identify',manufacturer:' collectibles catalog',photo:' figure identification'}[discoveryMode]||'';let q=a==='search-funko'?'site:funko.com '+value:a==='search-images'?value+' collectible figure':value+suffix;let endpoint=a==='search-images'?'https://www.google.com/search?tbm=isch&q=':'https://www.google.com/search?q=';window.open(a==='search-funko'?'https://funko.com/search/?term='+encodeURIComponent(value):endpoint+encodeURIComponent(q),'_blank','noopener,noreferrer')}}
$('add').onclick=()=>itemform();$('share').onclick=share;
function showStartupError(error){console.error('Moya Kolektsiya startup error:',error);let msg=error&&error.message?error.message:String(error);$('content').innerHTML='<div class="empty"><h2>Не вдалося запустити застосунок</h2><p>'+esc(msg)+'</p><button class="btn" id="retryStartup">Спробувати ще раз</button><p class="muted">Твої записи не видалені. Не очищай дані браузера, доки не створиш резервну копію.</p></div>';$('retryStartup').onclick=()=>location.reload()}
function emergencyNav(){for(let x of ['side','bottom'])$(x).innerHTML=menu.map(m=>'<button data-nav="'+m[0]+'" aria-label="'+esc(m[2])+'" title="'+esc(m[2])+'">'+(x==='bottom'?'<span class="tab-icon" aria-hidden="true">'+m[1]+'</span>':m[1]+' '+m[2])+'</button>').join('');document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>navigate(el.dataset.nav));$('sideVersion').textContent=VERSION}
(async()=>{emergencyNav();try{db=await opendb();let stored=await load();if(stored)data={folders:stored.folders||[],items:stored.items||[],settings:{theme:'purple',currency:'UAH',...stored.settings}};if(!location.hash)history.replaceState({page:'home',folder:null},'',routeUrl('home',null));applyRoute();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Service worker:',e))}catch(e){showStartupError(e)}})();
</script></body></html>
