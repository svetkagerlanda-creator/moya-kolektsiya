<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8655c8"><meta name="description" content="Моя колекція — особистий каталог колекціонера"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>Моя колекція</title><style>
:root{font:15px system-ui,Arial;--bg:#f0eafb;--fg:#372552;--panel:#fff;--accent:#8655c8;--sub:#7f7190;--edge:#d9cce8;--pale:#e8def6}
body[data-theme="light"]{--bg:#f7f8fa;--fg:#252c38;--panel:white;--accent:#5b6577;--sub:#707b8c;--edge:#e0e5ec;--pale:#eef1f4}
body[data-theme="dark"]{--bg:#15141b;--fg:#f2edf8;--panel:#262330;--accent:#b49af0;--sub:#b6a9c5;--edge:#423a50;--pale:#373044}
body[data-theme="mint"]{--bg:#e9f8f1;--fg:#1c4e3e;--panel:white;--accent:#2d9275;--sub:#6c8e81;--edge:#cde6dc;--pale:#d9f0e5}
body[data-theme="pink"]{--bg:#fff0f6;--fg:#693c53;--panel:white;--accent:#d36d9e;--sub:#a88095;--edge:#f0cddd;--pale:#fbe2ed}
body[data-theme="blue"]{--bg:#ecf6ff;--fg:#284c70;--panel:white;--accent:#458fc9;--sub:#7394ae;--edge:#cde3f5;--pale:#deefff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--accent)}h1{margin:0;font-size:28px}h2{font-size:20px}.app{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:100vh}.nav{background:var(--panel);border-right:1px solid var(--edge);padding:20px 12px;display:flex;flex-direction:column;gap:8px}.logo{font-size:22px;font-weight:800;padding:8px 10px 23px}.nav button,.bottom button{background:transparent;color:var(--fg);border:0;padding:12px;text-align:left;border-radius:12px}.nav button.active,.bottom button.active{background:var(--pale);color:var(--accent);font-weight:700}.foot{margin-top:auto;padding:12px;color:var(--sub);font-size:12px}.main{max-width:1200px;width:100%;margin:auto;padding:25px 25px 95px;min-width:0}.head,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.head{justify-content:space-between;margin-bottom:24px}.muted{color:var(--sub);font-size:13px}.btn{border:0;border-radius:12px;background:var(--accent);color:white;padding:11px 15px;font-weight:650}.alt{border:1px solid var(--edge);border-radius:12px;background:var(--panel);color:var(--fg);padding:10px 13px}.card{background:var(--panel);border:1px solid var(--edge);border-radius:17px;padding:15px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.big{font-size:26px;font-weight:800;margin-top:6px}.click{cursor:pointer}.click:hover{outline:1px solid var(--accent)}.visual{height:145px;background:var(--pale);border-radius:12px;display:grid;place-items:center;font-size:45px;overflow:hidden}.visual img{width:100%;height:100%;object-fit:contain}.tag{font-size:12px;color:var(--accent);background:var(--pale);border-radius:20px;padding:5px 9px;display:inline-block}.bar{height:8px;border-radius:10px;background:var(--pale);overflow:hidden;margin-top:8px}.bar div{height:100%;background:var(--accent)}.tools{display:flex;gap:9px;margin:15px 0;flex-wrap:wrap}.tools input{flex:1;min-width:160px}.field{border:1px solid var(--edge);background:var(--panel);color:var(--fg);border-radius:10px;padding:10px;width:100%}.fieldlabel{font-size:12px;color:var(--sub);display:block;margin-bottom:4px}.form{display:grid;gap:12px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modalback{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:12px;z-index:30}.modal{background:var(--panel);border-radius:18px;padding:22px;width:min(600px,100%);max-height:90vh;overflow:auto}.hidden{display:none}.bottom{display:none}.empty{padding:35px;text-align:center;border:1px dashed var(--edge);border-radius:16px;background:var(--panel)}.tablebox{overflow:auto}table{width:100%;border-collapse:collapse;background:var(--panel)}td,th{padding:10px;border-bottom:1px solid var(--edge);text-align:left;white-space:nowrap}.banner{padding:14px;background:var(--pale);border-radius:12px;font-size:13px}#toast{position:fixed;bottom:25px;right:20px;background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:12px;display:none;z-index:40}
@media(max-width:800px){.app{display:block}.nav{display:none}.main{padding:18px 13px 90px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--edge);z-index:20;justify-content:space-around;padding:7px 2px max(8px,env(safe-area-inset-bottom))}.bottom button{font-size:11px;padding:8px 4px}.pair{grid-template-columns:1fr}.visual{height:125px}}
</style></head><body data-theme="purple"><div class="app"><aside class="nav"><div class="logo">💜 Моя колекція</div><div id="side"></div><div class="foot">Версія 0.1.1<br>Особисте локальне сховище</div></aside><main class="main"><header class="head"><div><h1 id="heading">Моя колекція</h1><span class="muted">Твій персональний цифровий музей</span></div><div class="row"><button class="alt" id="share">↗ Поділитися</button><button class="btn" id="add">+ Додати предмет</button></div></header><div id="content"></div></main></div><nav id="bottom" class="bottom"></nav><div id="modal" class="hidden"></div><div id="toast" role="status"></div><input type="file" id="backupfile" accept=".json,application/json" hidden>
<script>
const VERSION='0.1.1', menu=[['home','⌂','Головна'],['collections','▣','Колекції'],['wishes','♡','Бажанки'],['search','⌕','Пошук'],['stats','▥','Статистика'],['settings','⚙','Налаштування']],themes=[['purple','Фіолетова'],['light','Світла'],['dark','Темна'],['mint',"М’ятна"],['pink','Рожева'],['blue','Блакитна']];
const $=x=>document.getElementById(x), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>crypto.randomUUID(),now=()=>new Date().toISOString(),fmt=x=>x===''||x==null?'—':Number(x).toLocaleString('uk-UA',{maximumFractionDigits:2})+' '+data.settings.currency;
let db,data={folders:[],items:[],settings:{theme:'purple',currency:'UAH'}},page='home',folder=null,searchTerm='',view='cards';
function opendb(){return new Promise((r,j)=>{let q=indexedDB.open('moya-kolektsiya',1);q.onupgradeneeded=()=>q.result.createObjectStore('store');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}
function load(){return new Promise((r,j)=>{let q=db.transaction('store').objectStore('store').get('main');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}
function save(){return new Promise((r,j)=>{let t=db.transaction('store','readwrite');t.objectStore('store').put(data,'main');t.oncomplete=r;t.onerror=()=>j(t.error)})}
const getfolder=x=>data.folders.find(f=>f.id===x),owned=x=>x.status==='owned'&&Number(x.quantity)>0;
function tree(x){let a=[x];for(let i=0;i<a.length;i++)a.push(...data.folders.filter(f=>f.parent===a[i]).map(f=>f.id));return a}
function showToast(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2700)}
function navigate(p,f){page=p;if(f!==undefined)folder=f;searchTerm='';render()}
function metric(){let items=data.items.filter(owned);return {have:items.length,spent:items.reduce((v,i)=>v+((i.purchasePrice===''||i.purchasePrice==null)?0:Number(i.purchasePrice)*Number(i.quantity||1)),0),market:items.reduce((v,i)=>v+((i.marketPrice===''||i.marketPrice==null)?0:Number(i.marketPrice)*Number(i.quantity||1)),0),priced:items.filter(i=>i.marketPrice!==''&&i.marketPrice!=null).length}}
function foldercard(f){let ids=tree(f.id),items=data.items.filter(i=>ids.includes(i.folder)),n=items.filter(owned).length;return '<div class="card click" data-folder="'+esc(f.id)+'"><div class="visual">'+(f.photo?'<img alt="" src="'+esc(f.photo)+'">':'📁')+'</div><h3>'+esc(f.name)+'</h3><span class="muted">'+n+' / '+items.length+' у наявності</span><div class="bar"><div style="width:'+(items.length?100*n/items.length:0)+'%"></div></div></div>'}
function itemcard(i){return '<div class="card click" data-item="'+esc(i.id)+'"><div class="visual">'+(i.photo?'<img alt="" src="'+esc(i.photo)+'">':'📦')+'</div><h3>'+esc(i.name)+'</h3><div class="muted">№ '+esc(i.figureNumber||'—')+' · '+esc(i.manufacturer||'—')+'</div><p><span class="tag">'+({owned:'✓ Маю',wish:'♡ Хочу',ordered:'🚚 Замовлено',skip:'Не цікавить'}[i.status]||'Немає')+'</span></p></div>'}
function cards(arr){return arr.length?(view==='cards'?'<div class="grid">'+arr.map(itemcard).join('')+'</div>':'<div class="tablebox"><table><tr><th>Назва</th><th>№</th><th>№ серії</th><th>Кількість</th><th>Наявність</th><th>Ринкова ціна</th></tr>'+arr.map(i=>'<tr class="click" data-item="'+esc(i.id)+'"><td>'+esc(i.name)+'</td><td>'+esc(i.figureNumber)+'</td><td>'+esc(i.seriesNumber)+'</td><td>'+esc(i.quantity)+'</td><td>'+esc(i.status)+'</td><td>'+fmt(i.marketPrice)+'</td></tr>').join('')+'</table></div>'):'<div class="empty">Тут поки нічого немає</div>'}
function home(){let s=metric(),root=data.folders.filter(f=>!f.parent);return '<div class="stats">'+[['📦 У наявності',s.have],['▣ Серій',data.folders.length],['♡ Бажанки',data.items.filter(i=>i.status==='wish').length],['₴ Ринкова вартість',fmt(s.market)]].map(x=>'<div class="card"><span class="muted">'+x[0]+'</span><div class="big">'+esc(x[1])+'</div></div>').join('')+'</div><h2>Швидкі дії</h2><div class="tools"><button class="btn" data-action="new-item">+ Предмет</button><button class="alt" data-action="new-folder">+ Папка</button><button class="alt" data-action="scan">▤ Штрихкод</button><button class="alt" data-action="backup">↓ Резервна копія</button></div><h2>Колекції</h2><div class="grid">'+root.map(foldercard).join('')+'</div>'+(root.length?'':'<div class="empty">Створи першу папку для своєї серії</div>')+'<h2>Останні придбання</h2>'+cards(data.items.filter(owned).slice().sort((a,b)=>(b.updated||'').localeCompare(a.updated||'')).slice(0,4))}
function collections(){if(folder&&!getfolder(folder))folder=null;let current=getfolder(folder),folders=data.folders.filter(f=>f.parent===folder),items=data.items.filter(i=>i.folder===folder&&[i.name,i.figureNumber,i.seriesNumber,i.manufacturer].join(' ').toLowerCase().includes(searchTerm.toLowerCase()));return '<div class="tools"><button class="alt" data-action="up">← Назад</button><b>'+esc(current?.name||'Усі колекції')+'</b><button class="alt" data-action="new-folder">+ Папка</button>'+(current?'<button class="alt" data-action="edit-folder">✎ Папка</button>':'')+'</div><div class="grid">'+folders.map(foldercard).join('')+'</div><h2>Предмети ('+items.length+')</h2><div class="tools"><input class="field" id="localquery" placeholder="Пошук у цій папці" value="'+esc(searchTerm)+'"><button class="alt" data-action="view">'+(view==='cards'?'Таблиця':'Картки')+'</button><button class="alt" data-action="checklist">Чекліст</button></div>'+cards(items)}
function wishes(){return '<h2>Хочу придбати</h2>'+cards(data.items.filter(i=>i.status==='wish'))+'<h2>Замовлено</h2>'+cards(data.items.filter(i=>i.status==='ordered'))}
function searching(){return '<div class="banner">Пошук у власному каталозі працює офлайн. Автоматичне завантаження повних серій та ринкових цін потребує підключення дозволених зовнішніх джерел — у v0.1.1 воно ще не реалізоване.</div><div class="tools"><input class="field" id="globalquery" placeholder="Назва, номер, виробник..." value="'+esc(searchTerm)+'"><button class="alt" data-action="external">Пошук в інтернеті ↗</button></div>'+cards(data.items.filter(i=>[i.name,i.figureNumber,i.seriesNumber,i.manufacturer].join(' ').toLowerCase().includes(searchTerm.toLowerCase())))}
function statistics(){let s=metric(),pct=data.items.length?Math.round(s.have/data.items.length*100):0;return '<div class="stats">'+[['Позицій у каталозі',data.items.length],['У наявності',s.have],['Фактично витрачено',fmt(s.spent)],['Оцінка на ринку',fmt(s.market)]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="big">'+esc(x[1])+'</div></div>').join('')+'</div><div class="card" style="margin-top:16px"><b>Заповнення: '+pct+'%</b><div class="bar"><div style="width:'+pct+'%"></div></div><p class="muted">Ринкова оцінка враховує лише '+s.priced+' позицій із зазначеною ціною.</p></div><h2>Серії</h2><div class="grid">'+data.folders.filter(f=>!f.parent).map(foldercard).join('')+'</div>'}
function settings(){return '<div class="card form"><h2>Оформлення</h2><label><span class="fieldlabel">Тема</span><select id="theme" class="field">'+themes.map(t=>'<option value="'+t[0]+'" '+(data.settings.theme===t[0]?'selected':'')+'>'+t[1]+'</option>').join('')+'</select></label><label><span class="fieldlabel">Валюта</span><select id="currency" class="field">'+['UAH','USD','EUR','PLN'].map(c=>'<option '+(data.settings.currency===c?'selected':'')+'>'+c+'</option>').join('')+'</select></label><h2>Резервні копії</h2><div class="row"><button class="btn" data-action="backup">↓ Експорт JSON з фотографіями</button><button class="alt" data-action="import">↑ Відновити копію</button></div><div class="banner">Дані зберігаються в IndexedDB цього браузера. Для перенесення на інший пристрій роби резервні копії. Очищення даних браузера може видалити каталог.</div><h2>Про застосунок</h2><b>Моя колекція · v'+VERSION+'</b><button class="alt" data-action="share">↗ Поділитися застосунком</button><span class="muted">Інші користувачі отримають сам застосунок, а не твої приватні записи.</span></div>'}
function render(){document.body.dataset.theme=data.settings.theme;$('heading').textContent=menu.find(x=>x[0]===page)[2];for(let nav of ['side','bottom'])$(nav).innerHTML=menu.map(x=>'<button data-nav="'+x[0]+'" class="'+(x[0]===page?'active':'')+'">'+x[1]+' '+x[2]+'</button>').join('');$('content').innerHTML=({home,collections,wishes,search:searching,stats:statistics,settings})[page]();document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>navigate(el.dataset.nav));document.querySelectorAll('[data-folder]').forEach(el=>el.onclick=()=>navigate('collections',el.dataset.folder));document.querySelectorAll('[data-item]').forEach(el=>el.onclick=()=>viewitem(el.dataset.item));document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>action(el.dataset.action));for(let target of ['localquery','globalquery'])if($(target))$(target).oninput=e=>{searchTerm=e.target.value;const pos=e.target.selectionStart;render();$(target).focus();$(target).setSelectionRange(pos,pos)};if($('theme'))$('theme').onchange=async e=>{data.settings.theme=e.target.value;await save();render()};if($('currency'))$('currency').onchange=async e=>{data.settings.currency=e.target.value;await save();render()}}
function modal(title,html){$('modal').className='modalback';$('modal').innerHTML='<div class="modal" role="dialog" aria-modal="true"><div class="row" style="justify-content:space-between"><h2>'+esc(title)+'</h2><button class="alt" id="close">✕</button></div>'+html+'</div>';$('close').onclick=close}
function close(){$('modal').className='hidden';$('modal').innerHTML=''}
function inp(name,label,value='',type='text'){return '<label><span class="fieldlabel">'+label+'</span><input class="field" name="'+name+'" type="'+type+'" value="'+esc(value??'')+'"></label>'}
function folderopts(selected,exclude){return '<option value="">Корінь / без папки</option>'+data.folders.filter(f=>!exclude||!tree(exclude).includes(f.id)).map(f=>'<option value="'+esc(f.id)+'" '+(f.id===selected?'selected':'')+'>'+esc(f.name)+'</option>').join('')}
function img(file){return new Promise((res,rej)=>{if(file.size>5e6)return rej(Error('Максимальний розмір фото 5 МБ'));let r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(Error('Помилка читання фото'));r.readAsDataURL(file)})}
function folderform(fid){let f=getfolder(fid)||{};modal(fid?'Редагувати папку':'Нова папка','<form id="folderform" class="form">'+inp('name','Назва *',f.name)+'<label><span class="fieldlabel">Батьківська папка</span><select class="field" name="parent">'+folderopts(f.parent??folder,fid)+'</select></label><label><span class="fieldlabel">Фото папки</span><input class="field" name="photo" type="file" accept="image/*"></label><div class="row"><button class="btn">Зберегти</button>'+(fid?'<button type="button" class="alt" id="removefolder">Видалити папку</button>':'')+'</div></form>');$('folderform').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target),name=String(fd.get('name')).trim();if(!name)return showToast('Вкажи назву');let o={...f,id:fid||id(),name,parent:String(fd.get('parent')||'')||null,photo:f.photo||''};if(fd.get('photo')?.size)try{o.photo=await img(fd.get('photo'))}catch(err){return showToast(err.message)}if(fid)Object.assign(f,o);else data.folders.push(o);await save();close();render();showToast('Папку збережено')};if(fid)$('removefolder').onclick=async()=>{let ids=tree(fid);if(!confirm('Видалити цю папку, всі підпапки та предмети?'))return;data.folders=data.folders.filter(f=>!ids.includes(f.id));data.items=data.items.filter(i=>!ids.includes(i.folder));folder=null;await save();close();render()}}
function viewitem(iid){let i=data.items.find(x=>x.id===iid);if(!i)return showToast('Предмет не знайдено');let status={owned:'✓ Маю',wish:'♡ Хочу',ordered:'🚚 Замовлено',skip:'Не цікавить'},conditions={unknown:'Не вказано',new:'Новий',excellent:'Відмінний',good:'Хороший',damaged:'З дефектами'};let rows=[['Назва',i.name],['Номер фігурки',i.figureNumber||'—'],['Номер серії',i.seriesNumber||'—'],['Виробник',i.manufacturer||'—'],['Папка / серія',getfolder(i.folder)?.name||'Без папки'],['Кількість',i.quantity??0],['Наявність',status[i.status]||'Не вказано'],['Стан',conditions[i.condition]||'Не вказано'],['Ціна придбання',fmt(i.purchasePrice)],['Ринкова ціна',fmt(i.marketPrice)],['Рік випуску',i.year||'—']];let photo=i.photo?'<img alt="'+esc(i.name)+'" src="'+esc(i.photo)+'" style="width:100%;max-height:330px;object-fit:contain;border-radius:12px;background:var(--pale)">':'<div class="visual" style="height:190px">📦</div>';modal(i.name,'<div class="form">'+photo+'<div class="tablebox"><table><tbody>'+rows.map(r=>'<tr><th style="width:42%;white-space:normal">'+esc(r[0])+'</th><td style="white-space:normal">'+esc(r[1])+'</td></tr>').join('')+'</tbody></table></div><div class="row"><button class="btn" id="viewedit">✎ Редагувати</button><button class="alt" id="viewhistory">▥ Історія цін</button><button class="alt" id="viewclose">Закрити</button></div></div>');$('viewedit').onclick=()=>itemform(iid);$('viewhistory').onclick=()=>historyform(iid);$('viewclose').onclick=close}
function itemform(iid){let i=data.items.find(x=>x.id===iid)||{status:'wish',condition:'unknown',quantity:0,history:[]};modal(iid?'Редагувати предмет':'Новий предмет','<form id="itemform" class="form">'+inp('name','Назва *',i.name)+'<div class="pair">'+inp('figureNumber','Номер фігурки',i.figureNumber)+inp('seriesNumber','Номер серії',i.seriesNumber)+'</div>'+inp('manufacturer','Виробник',i.manufacturer)+'<label><span class="fieldlabel">Папка / серія</span><select class="field" name="folder">'+folderopts(i.folder??folder)+'</select></label><div class="pair">'+inp('quantity','Кількість',i.quantity,'number')+inp('year','Рік випуску',i.year,'number')+'</div><div class="pair"><label><span class="fieldlabel">Наявність</span><select class="field" name="status">'+[['owned','Маю'],['wish','Хочу'],['ordered','Замовлено'],['skip','Не цікавить']].map(x=>'<option value="'+x[0]+'" '+(i.status===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></label><label><span class="fieldlabel">Стан</span><select name="condition" class="field">'+[['unknown','Не вказано'],['new','Новий'],['excellent','Відмінний'],['good','Хороший'],['damaged','З дефектами']].map(x=>'<option value="'+x[0]+'" '+(i.condition===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></label></div><div class="pair">'+inp('purchasePrice','Ціна придбання / шт.',i.purchasePrice,'number')+inp('marketPrice','Ринкова ціна / шт.',i.marketPrice,'number')+'</div><label><span class="fieldlabel">Фото (до 5 МБ)</span><input class="field" name="photo" type="file" accept="image/*"></label>'+(i.photo?'<img alt="Фото" src="'+esc(i.photo)+'" style="height:90px;object-fit:contain">':'')+'<div class="row"><button class="btn">Зберегти</button>'+(iid?'<button class="alt" type="button" id="history">Історія цін</button><button class="alt" type="button" id="removeitem">Видалити</button>':'')+'</div></form>');$('itemform').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target),name=String(fd.get('name')).trim();if(!name)return showToast('Вкажи назву');let o={...i,id:iid||id(),updated:now(),history:i.history||[],name};for(let k of ['figureNumber','seriesNumber','manufacturer','folder','year','status','condition'])o[k]=String(fd.get(k)||'');o.quantity=Math.max(0,Number(fd.get('quantity')||0));if(o.status==='owned'&&o.quantity===0)o.quantity=1;for(let k of ['purchasePrice','marketPrice']){let v=fd.get(k);o[k]=v===''?'':Math.max(0,Number(v))}if(o.marketPrice!==''&&String(o.marketPrice)!==String(i.marketPrice))o.history.push({date:now().slice(0,10),price:o.marketPrice,source:'Ручне редагування'});if(fd.get('photo')?.size)try{o.photo=await img(fd.get('photo'))}catch(err){return showToast(err.message)}if(iid)Object.assign(i,o);else data.items.push(o);await save();close();render();showToast('Предмет збережено')};if(iid){$('history').onclick=()=>historyform(iid);$('removeitem').onclick=async()=>{if(!confirm('Видалити предмет?'))return;data.items=data.items.filter(x=>x.id!==iid);await save();close();render()}}}
function historyform(iid){let i=data.items.find(x=>x.id===iid);modal('Історія цін: '+i.name,'<div class="form">'+(i.history||[]).map(h=>'<div class="card">'+esc(h.date)+' · '+fmt(h.price)+' · '+esc(h.source)+'</div>').join('')+'<form id="histform" class="form">'+inp('date','Дата',now().slice(0,10),'date')+inp('price','Ринкова ціна',i.marketPrice,'number')+inp('source','Джерело','Ручна оцінка')+'<button class="btn">Додати оцінку</button></form></div>');$('histform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);if(f.get('price')==='')return showToast('Вкажи ціну');let x={date:f.get('date'),price:Math.max(0,Number(f.get('price'))),source:String(f.get('source'))};i.history??=[];i.history.push(x);i.marketPrice=x.price;await save();close();render();showToast('Оцінку збережено')}}
function checklist(){let ids=folder?tree(folder):null,items=data.items.filter(i=>!owned(i)&&(!ids||ids.includes(i.folder)));modal('Чекліст відсутніх','<div class="form">'+items.map(i=>'<div>☐ '+esc(i.name)+' · № '+esc(i.figureNumber||'—')+'</div>').join('')+'<button class="btn" id="copy">Копіювати список</button></div>');$('copy').onclick=()=>navigator.clipboard?.writeText(items.map(i=>'☐ '+i.name+' №'+(i.figureNumber||'—')).join('\n')).then(()=>showToast('Скопійовано'))}
function backup(){let blob=new Blob([JSON.stringify({app:'moya-kolektsiya',version:VERSION,created:now(),data})],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='moya-kolektsiya-'+now().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('Копію створено')}
$('backupfile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let x=JSON.parse(await file.text());if(x.app!=='moya-kolektsiya'||!Array.isArray(x.data?.folders)||!Array.isArray(x.data?.items))throw Error('Невідповідний формат');if(!confirm('Замінити всі поточні дані резервною копією?'))return;data={folders:x.data.folders,items:x.data.items,settings:{theme:'purple',currency:'UAH',...x.data.settings}};await save();navigate('home',null);showToast('Відновлено')}catch(err){showToast('Помилка імпорту: '+err.message)}e.target.value=''};
async function share(){try{if(navigator.share){await navigator.share({title:'Моя колекція',url:location.href});return}await navigator.clipboard.writeText(location.href);showToast('Посилання скопійовано')}catch(err){if(err.name!=='AbortError')showToast('Скопіюй адресу з браузера')}}
function scan(){modal('Сканування штрихкоду','<video id="video" autoplay playsinline style="width:100%;max-height:250px;background:#111;border-radius:10px"></video><p class="muted">Камера доступна лише за HTTPS і в браузерах із BarcodeDetector.</p>'+inp('code','Номер / штрихкод','')+'<div class="tools"><button class="btn" id="checkcode">Знайти</button><button class="alt" id="startcam">Увімкнути камеру</button></div>');$('checkcode').onclick=()=>{let code=document.querySelector('input[name=code]').value.trim();if(!code)return;let i=data.items.find(x=>x.figureNumber===code||x.barcode===code);close();if(i)itemform(i.id);else{itemform();document.querySelector('input[name=figureNumber]').value=code;showToast('Заповни картку вручну')}};$('startcam').onclick=async()=>{if(!('BarcodeDetector'in window)||!navigator.mediaDevices)return showToast('Сканер недоступний, введи номер');try{let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),v=$('video');v.srcObject=s;let det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']}),timer=setInterval(async()=>{if(!document.contains(v)){clearInterval(timer);s.getTracks().forEach(t=>t.stop());return}try{let r=await det.detect(v);if(r.length){document.querySelector('input[name=code]').value=r[0].rawValue;clearInterval(timer);s.getTracks().forEach(t=>t.stop());showToast('Код зчитано')}}catch{}},650)}catch{showToast('Не вдалося ввімкнути камеру')}}}
function action(a){if(a==='new-item')itemform();else if(a==='new-folder')folderform();else if(a==='edit-folder')folderform(folder);else if(a==='up')navigate('collections',getfolder(folder)?.parent||null);else if(a==='view'){view=view==='cards'?'table':'cards';render()}else if(a==='checklist')checklist();else if(a==='backup')backup();else if(a==='import')$('backupfile').click();else if(a==='share')share();else if(a==='scan')scan();else if(a==='external')window.open('https://www.google.com/search?q='+encodeURIComponent(searchTerm||'Funko POP catalog'),'_blank','noopener')}
$('add').onclick=()=>itemform();$('share').onclick=share;
(async()=>{try{db=await opendb();let stored=await load();if(stored)data={folders:stored.folders||[],items:stored.items||[],settings:{theme:'purple',currency:'UAH',...stored.settings}};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){$('content').innerHTML='<div class="empty">Помилка локального сховища: '+esc(e.message)+'</div>'}})();
</script></body></html>
