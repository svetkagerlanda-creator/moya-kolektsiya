function fandomMatch(value){let text=String(value||'').trim();let exact=FANDOMS.find(f=>f.key!=='other'&&f.name.toLocaleLowerCase('uk-UA')===text.toLocaleLowerCase('uk-UA'));if(exact)return exact.key;return FANDOMS.find(f=>f.key!=='other'&&f.key!=='mlp'&&f.pattern?.test(text))?.key||(FANDOMS[0].pattern.test(text)?'mlp':'other')}
function fandomAncestor(folderId){let seen=new Set;while(folderId&&!seen.has(folderId)){seen.add(folderId);let f=getfolder(folderId);if(!f)break;if(f.kind==='fandom'&&f.fandomKey)return f.fandomKey;folderId=f.parent}return null}

async function ensureFandomFolders(){
 // Preserve every existing folder. New fandom roots are created only on demand.
 // Previously generated fandom folders remain available, even when empty.
 let changed=false, snapshot=JSON.stringify(data.folders);
 for(const entry of FANDOMS){
  let current=fandomRoot(entry.key), legacy=!current&&data.folders.find(f=>!f.parent&&f.name===entry.name);
  if(legacy){legacy.kind='fandom';legacy.fandomKey=entry.key;changed=true}
 }
 for(const f of data.folders){
  if(f.parent||f.kind==='fandom'||f.kind==='manufacturer')continue;
  const key=fandomMatch(f.name),target=key!=='other'?fandomRoot(key):null;
  if(target&&target.id!==f.id){f.parent=target.id;changed=true}
 }
 // Legacy versions generated all six default fandom roots without asking.
 // Remove ONLY untouched empty default roots; never touch children, items,
 // custom fandoms or roots explicitly created by the user in newer versions.
 const autoKeys=new Set(FANDOMS.map(x=>x.key));
 const toRemove=new Set(data.folders.filter(f=>f.kind==='fandom'&&autoKeys.has(f.fandomKey)&&!f.userSelected&&!f.photo&&!f.source&&!f.description&&!f.updated&&!data.folders.some(child=>child.parent===f.id)&&!data.items.some(item=>item.folder===f.id)).map(f=>f.id));
 if(toRemove.size){data.folders=data.folders.filter(f=>!toRemove.has(f.id));changed=true}
 if(changed)try{await save()}catch(e){data.folders=JSON.parse(snapshot);console.warn('Fandom migration not saved:',e)}
}

  options.push({key:f.fandomKey,name:f.name,icon:f.icon||'🌐',existing:f});
 }
 return options;
}

function manufacturerOptions(){

 const unique=new Map;for(const name of names){const key=manufacturerNorm(name);if(!unique.has(key))unique.set(key,name.trim())}

async function createFandomFolder(key,name,icon){
 let existing=fandomRoot(key)||data.folders.find(f=>f.kind==='fandom'&&f.name.toLocaleLowerCase('uk-UA')===name.toLocaleLowerCase('uk-UA'));
 if(existing){close();selectedFandomKey=existing.fandomKey;navigate('collections',null);return}
 let created={id:id(),name,parent:null,kind:'fandom',fandomKey:key,userSelected:true,icon:icon||'🌐',photo:'',created:now()};

 try{await save()}catch(e){data.folders=data.folders.filter(f=>f.id!==created.id);showToast('Не вдалося створити фандом');return}

}

function collectionItemPriority(item){

function mlpMerchRoot(source){
 const value=String(source||'').trim();
 const prefix='https://data.mlpmerch.com/';
 if(!value.startsWith(prefix))return '';
 return value.slice(prefix.length).split('/')[0]||'';
}
function mlpSourceGeneration(source){return MLP_GENERATION_GROUPS[mlpMerchRoot(source)]?.[0]||''}
function categorizeGeneratedSeries(series){
 const classification=MLP_GENERATION_GROUPS[mlpMerchRoot(series.source)];
 if(!classification)return series;
 return {...series,fandomKey:'mlp',group:'🦄 My Little Pony · '+classification[0]+' · '+classification[1]};

function scan(){
 let stream=null,timer=null,busy=false;
 const stop=()=>{if(timer){clearInterval(timer);timer=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}};
 modal('Сканування штрихкоду','<video id="video" autoplay muted playsinline style="width:100%;max-height:250px;background:#111;border-radius:10px"></video><p class="muted">Камера потребує HTTPS і підтримки BarcodeDetector; можна ввести код вручну.</p>'+inp('code','Штрихкод / номер','')+'<div class="tools"><button class="btn" id="checkcode">Знайти</button><button class="alt" id="startcam">Увімкнути камеру</button><button class="alt" id="stopcam">Зупинити камеру</button></div><div id="scanresults" aria-live="polite"></div>');
 const input=document.querySelector('input[name=code]'),results=$('scanresults');
 // GTIN-8/12/13/14 can be rendered with leading zeroes by different scanners.
 // Keep product codes separate from SKU / Funko figure number lookup.
 const isGtin=c=>/^(?:\d{8}|\d{12,14})$/.test(c)&&(()=>{
  const digits=c.split('').map(Number),sum=digits.slice(0,-1).reverse().reduce((n,d,k)=>n+d*(k%2===0?3:1),0);
  return (10-sum%10)%10===digits[digits.length-1];
 })();
 const equalCode=(a,b)=>a!=null&&String(a).trim()===b;
 const matches=(item,code)=>{
  if(isGtin(code))return ['barcode','ean','upc','gtin'].some(k=>{
   const candidate=String(item[k]||'').trim();
   return isGtin(candidate)&&candidate.padStart(14,'0')===code.padStart(14,'0');
  });
  return ['barcode','ean','upc','gtin','productSku','retailerSku','figureNumber','seriesNumber'].some(k=>equalCode(item[k],code));
 };
 function search(){
  const code=input.value.trim();if(!code)return showToast('Введи або зіскануй код');stop();
  // A sealed mystery assortment identifies its series, never a random character.
  // The same code may appear on every variant as assortmentUpc.
  const mysterySeries=[...generatedSeries,...COMPLETE_SERIES_DATA,...COMPLETE_FIGURE_SERIES]
   .filter(s=>s.assortmentUpc||s.assortmentEan||/mystery|blind[ -]?(?:box|bag)|сюрприз|bratziez/i.test([s.name,s.group].join(' ')))
   .filter(s=>{
    const sameGtins=a=>isGtin(code)&&isGtin(String(a||'').trim())&&String(a).trim().padStart(14,'0')===code.padStart(14,'0');
    if(['assortmentUpc','assortmentEan'].some(k=>sameGtins(s[k])))return true;
    return listCompleteCards(s).some(i=>
     ['assortmentUpc','assortmentEan'].some(k=>sameGtins(i[k]))||matches(i,code));
   });
  const uniqueMystery=[...new Map(mysterySeries.map(s=>[s.name,s])).values()];
  const openMysterySeries=s=>{
   const existing=importedSeriesFolder(s);
   close();
   if(existing)navigate('collections',existing.id);
   else browseSeriesDirectory(s.name);
  };
  if(uniqueMystery.length===1){openMysterySeries(uniqueMystery[0]);return;}
  if(uniqueMystery.length>1){
   results.innerHTML='<h3>Знайдено серії: '+esc(code)+'</h3><p class="muted">Штрихкод mystery-набору відкриває серію, а не випадкового персонажа.</p>'
    +uniqueMystery.map((s,n)=>'<div class="card"><b>'+esc(s.name)+'</b><button type="button" data-mystery-series="'+n+'">Переглянути серію</button></div>').join('');
   results.querySelectorAll('[data-mystery-series]').forEach(b=>b.onclick=()=>{openMysterySeries(uniqueMystery[Number(b.dataset.mysterySeries)])});
   return;
  }
  const mine=data.items.filter(i=>matches(i,code)),catalog=[],seen=new Set();
  for(const series of [...generatedSeries,...COMPLETE_SERIES_DATA,...COMPLETE_FIGURE_SERIES]){
   for(const item of listCompleteCards(series)){if(!matches(item,code))continue;
    const key=[series.source||series.name,item.variantKey||item.sourceUrl||item.name].join('|');if(seen.has(key))continue;seen.add(key);catalog.push({series,item});
   }
  }
  results.innerHTML='<h3>Результати: '+esc(code)+'</h3>'
   +mine.map(i=>'<div class="card"><b>'+esc(i.name)+'</b><p>Моя колекція</p><button type="button" data-scan-own="'+esc(i.id)+'">Відкрити картку</button></div>').join('')
   +catalog.slice(0,30).map((x,n)=>'<div class="card"><b>'+esc(x.item.name)+'</b><p class="muted">'+esc(x.series.name)+'</p><button type="button" data-scan-series="'+n+'">Переглянути серію</button></div>').join('')
   +(!mine.length&&!catalog.length?'<p>Точного збігу немає.</p>':'')
   +'<button class="alt" type="button" id="scanNew">＋ Додати новий предмет</button>';
  results.querySelectorAll('[data-scan-own]').forEach(b=>b.onclick=()=>{stop();close();viewitem(b.dataset.scanOwn)});
  results.querySelectorAll('[data-scan-series]').forEach(b=>b.onclick=()=>{let name=catalog[Number(b.dataset.scanSeries)].series.name;stop();close();browseSeriesDirectory(name)});
  $('scanNew').onclick=()=>{stop();close();itemform();let field=document.querySelector('#itemform input[name=barcode]');if(field)field.value=code};
 }
 $('checkcode').onclick=search;
 input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();search()}};
 $('stopcam').onclick=stop;
 $('startcam').onclick=async()=>{
  if(!window.isSecureContext||!window.BarcodeDetector||!navigator.mediaDevices?.getUserMedia)return showToast('Сканер недоступний — введи код вручну');
  stop();
  try{const video=$('video'),detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
   stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
   if(!video.isConnected){stop();return}
   video.srcObject=stream;await video.play();
   timer=setInterval(async()=>{if(!video.isConnected){stop();return}if(busy||video.readyState<2)return;
    busy=true;try{let r=await detector.detect(video);if(r.length){input.value=r[0].rawValue;stop();search()}}catch(e){console.warn('Barcode detection',e)}finally{busy=false}
   },650);
  }catch(e){stop();showToast('Камера недоступна: перевір дозвіл браузера')}
 };
