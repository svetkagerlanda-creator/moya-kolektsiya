name: Verify missing Kayou series 4
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: moya-kolektsiya-catalog-writes
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/build_mlpmerch.py
      - name: Publish checked lists and errors
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogs/verified-mlpmerch.json catalogs/merch-errors.json
          if ! git diff --cached --quiet; then
            git commit -m "data: verify last Kayou series"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 2
            done
            echo "::error::Could not publish safely after 5 attempts"
            exit 1
          fi
