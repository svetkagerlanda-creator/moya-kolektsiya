name: Repair verified fandom metadata
on:
  push:
    branches: [main]
    paths:
      - 'scripts/normalize_fandom_keys.py'
      - '.github/workflows/repair-fandom-metadata.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: moya-kolektsiya-catalog-writes
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add canonical MLP keys only to verified MLP series
        run: python scripts/normalize_fandom_keys.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogs/verified-blind-bags.json catalogs/verified-brushables.json catalogs/verified-kayou.json catalogs/verified-mlp-all-series.json catalogs/verified-mlp-figures.json catalogs/verified-mlpmerch.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: assign My Little Pony fandom to legacy series"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git -c merge.conflictstyle=merge rebase -X theirs origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 2
            done
            exit 1
          fi
