name: Refresh verified collection catalogs
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_catalogs.py'
      - 'scripts/probe_sources.py'
      - '.github/workflows/refresh-collectibles.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: write
jobs:
  build-catalogs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Fetch and validate every card
        run: python scripts/build_catalogs.py
      - name: Inspect additional merchandise sources
        run: python scripts/probe_sources.py
      - name: Commit catalog only when verified data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogs/verified-kayou.json catalogs/source-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh verified Kayou catalogs"
            git push
          fi
