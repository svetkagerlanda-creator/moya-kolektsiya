name: Refresh verified collection catalogs
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_catalogs.py'
      - 'scripts/probe_sources.py'
      - 'scripts/build_mlpmerch.py'
      - 'scripts/build_brushables.py'
      - 'scripts/build_blind_bags.py'
      - 'scripts/build_more_figures.py'
      - 'scripts/build_all_mlp_series.py'
      - 'scripts/build_new_fandoms.py'
      - 'scripts/enrich_wishlist_popmart_photos.py'
      - 'scripts/build_historical_dolls_pets.py'
      - 'scripts/test_build_all_mlp_series.py'
      - 'scripts/probe_comic_layout.py'
      - 'scripts/audit_catalog_coverage.py'
      - '.github/workflows/refresh-collectibles.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: write
concurrency:
  group: moya-kolektsiya-catalog-writes
  cancel-in-progress: false
jobs:
  build-catalogs:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Check MLP import source paths and comics parser
        run: python -m unittest discover -s scripts -p 'test_build_all_mlp_series.py'
      - name: Fetch and validate every card
        run: python scripts/build_catalogs.py
      - name: Build final two Kayou editions from MLP Merch
        run: python scripts/build_mlpmerch.py
      - name: Build photographed G4 Brushables releases
        run: python scripts/build_brushables.py
      - name: Build verified G4 Blind Bags waves
        run: python scripts/build_blind_bags.py
      - name: Build verified CMC Ponyville Guardians and other MLP figures
        run: python scripts/build_more_figures.py
      - name: Record comic page layout to investigate blocked series
        run: python scripts/probe_comic_layout.py
      - name: Import verified MLP Merch series from all generations
        run: python scripts/build_all_mlp_series.py
      - name: Build Bratz Monster High Ever After High Sylvanian LPS Winx verified items
        run: python scripts/build_new_fandoms.py
      - name: Import historical Monster High EAH and LPS collections
        run: python scripts/build_historical_dolls_pets.py
      - name: Inspect additional merchandise sources
        run: python scripts/probe_sources.py
      - name: Enrich wishlist series with exact official POP MART figure photos
        run: python scripts/enrich_wishlist_popmart_photos.py
      - name: Audit verified series and photo coverage
        run: python scripts/audit_catalog_coverage.py
      - name: Commit catalog only when verified data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogs/verified-user-wishlist-starters.json catalogs/wishlist-variant-photo-audit.json catalogs/verified-historical-dolls-pets.json catalogs/historical-dolls-pets-errors.json catalogs/verified-new-fandoms.json catalogs/new-fandoms-errors.json catalogs/comic-layout-probe.json catalogs/catalog-coverage.json catalogs/verified-mlp-all-series.json catalogs/mlp-all-series-errors.json catalogs/verified-kayou.json catalogs/verified-mlpmerch.json catalogs/verified-brushables.json catalogs/brushables-errors.json catalogs/verified-blind-bags.json catalogs/blind-bags-errors.json catalogs/verified-mlp-figures.json catalogs/figure-errors.json catalogs/source-probe.json catalogs/merch-errors.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh verified Kayou catalogs"
            # The repository may receive a newer commit while catalogs are built.
            # Rebase our generated files instead of trying to overwrite newer work.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git -c merge.conflictstyle=merge rebase -X theirs origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Repository updated concurrently; retrying ($attempt/5)"
              sleep 2
            done
            echo "::error::Could not publish after five safe retries"
            exit 1
          fi
